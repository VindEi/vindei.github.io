<section class="game-container snake-module">
  <div class="back-nav-container">
    <a href="/hub" class="back-link hover-target">
      <i class="fas fa-arrow-left"></i> Back to Hub
    </a>
  </div>

  <div class="snake-layout">
    <!-- Main Canvas Viewport -->
    <div class="canvas-viewport-card">
      <div class="viewport-telemetry-bar">
        <div class="status-indicator">
          <span class="status-pulse-dot" id="snake-status-dot"></span>
          <span id="snake-status-text">Ready</span>
        </div>
        <div class="telemetry-metrics">
          <span>Score: <b id="snake-score">0</b></span>
          <span>Best: <b id="snake-best">0</b></span>
        </div>
      </div>

      <div class="canvas-wrapper">
        <canvas id="snake-canvas" width="400" height="400"></canvas>

        <!-- Start / Game Over Overlay -->
        <div id="snake-overlay" class="game-overlay active">
          <div class="overlay-modal">
            <h2 id="overlay-title">Snake</h2>
            <p id="overlay-desc">Use arrow keys, WASD, or swipe to steer.</p>
            <button
              id="snake-action-btn"
              class="btn-action primary hover-target"
              type="button"
            >
              <i class="fas fa-play"></i> Start Game
            </button>
          </div>
        </div>
      </div>

      <!-- Mobile D-Pad -->
      <div class="mobile-dpad" id="snake-dpad">
        <div class="dpad-row">
          <button class="dpad-btn hover-target" data-dir="UP" aria-label="Up">
            <i class="fas fa-chevron-up"></i>
          </button>
        </div>
        <div class="dpad-row middle">
          <button
            class="dpad-btn hover-target"
            data-dir="LEFT"
            aria-label="Left"
          >
            <i class="fas fa-chevron-left"></i>
          </button>
          <div class="dpad-core"></div>
          <button
            class="dpad-btn hover-target"
            data-dir="RIGHT"
            aria-label="Right"
          >
            <i class="fas fa-chevron-right"></i>
          </button>
        </div>
        <div class="dpad-row">
          <button
            class="dpad-btn hover-target"
            data-dir="DOWN"
            aria-label="Down"
          >
            <i class="fas fa-chevron-down"></i>
          </button>
        </div>
      </div>
    </div>

    <!-- Side Panel -->
    <div class="game-side-panel">
      <div class="panel-card">
        <h3>Difficulty</h3>
        <div class="speed-selector">
          <button
            class="speed-btn active hover-target"
            data-speed="110"
            type="button"
          >
            Normal
          </button>
          <button class="speed-btn hover-target" data-speed="80" type="button">
            Fast
          </button>
          <button class="speed-btn hover-target" data-speed="50" type="button">
            Insane
          </button>
        </div>

        <button
          id="snake-pause-btn"
          class="btn-action hover-target"
          style="width: 100%; margin-top: 1.5rem"
          type="button"
        >
          <i class="fas fa-pause"></i> Pause Game
        </button>
      </div>

      <div class="panel-card" style="margin-top: 1.5rem">
        <h3>Controls</h3>
        <div class="controls-guide">
          <div class="control-row-item">
            <span class="key-badge">W A S D</span> /
            <span class="key-badge">Arrows</span>
            <span>Steer snake</span>
          </div>
          <div class="control-row-item">
            <span class="key-badge">Space</span>
            <span>Pause / resume</span>
          </div>
          <div class="control-row-item">
            <span class="key-badge">Swipe</span>
            <span>Mobile touch control</span>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
