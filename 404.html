<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VindE | 404</title>
    <script>
      /**
       * GitHub Pages SPA Direct-URL Redirect Handler
       * If loaded via a hard refresh or bookmark on GitHub Pages, transparently
       * routes back to index.html with the destination query preserved.
       */
      (function () {
        var validRoutes = [
          "/projects",
          "/projects/snapdns",
          "/tools",
          "/tools/echo",
          "/tools/data",
          "/hub",
          "/hub/snake",
          "/snake",
          "/hub/rng",
          "/rng",
        ];
        var path = window.location.pathname;
        var segments = path.split("/").filter(Boolean);
        var subpath = path;

        // Detect if repository name is prefixed
        if (
          window.location.hostname.endsWith("github.io") &&
          segments.length > 0
        ) {
          subpath = "/" + segments.slice(1).join("/");
        }

        if (validRoutes.indexOf(subpath) !== -1) {
          var base =
            segments.length > 1 &&
            window.location.hostname.endsWith("github.io")
              ? "/" + segments[0]
              : "";
          sessionStorage.setItem(
            "spa_redirect",
            path + window.location.search + window.location.hash,
          );
          window.location.replace(base + "/");
        }
      })();
    </script>
    <link rel="stylesheet" href="assets/css/style.css?v=1.0.2" />
    <link rel="stylesheet" href="assets/css/error.css?v=1.0.2" />
    <link rel="stylesheet" href="assets/css/cursor.css?v=1.0.2" />
  </head>
  <body>
    <div class="sr-only" role="alert">
      Error 404: Page Not Found. The requested address is invalid or corrupted.
      Press any key or tap anywhere to return home.
    </div>

    <div class="bsod-container" aria-hidden="true">
      <div class="crt-overlay"></div>

      <div class="terminal-wrapper">
        <div
          class="error-line error-top-box"
          data-text="ERROR 404 // NOT_FOUND"
        ></div>

        <div class="error-content">
          <p class="error-line" data-text="> Requested page could not be found."></p>
          <p
            class="error-line"
            data-text="> The link might be broken or moved."
          ></p>

        </div>

        <div class="prompt-container">
          <span
            class="error-line prompt-text"
            data-text="Press any key or tap anywhere to return home..."
          ></span>
          <span class="blinking-cursor">_</span>
        </div>
      </div>
    </div>

    <script src="assets/js/error.js" defer></script>
  </body>
</html>
